<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>ScienceSpark 2026 | Registration</title>
	<style>
		:root {
			--navy: #102a43;
			--blue: #1769aa;
			--cyan: #28c7d9;
			--light: #f4fbff;
			--text: #243b53;
		}

		* { box-sizing: border-box; }

		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			padding: 24px;
			font-family: Arial, sans-serif;
			color: var(--text);
			background: radial-gradient(circle at top left, #d9f7ff, transparent 40%),
        linear-gradient(135deg, #eef8ff, #d8e9ff);
		}

		.card {
			width: min(100%, 480px);
			padding: 38px;
			background: rgba(255, 255, 255, 0.96);
			border: 1px solid #d7edf8;
			border-radius: 22px;
			box-shadow: 0 20px 55px rgba(16, 42, 67, 0.16);
		}

		.badge {
			display: inline-block;
			margin-bottom: 14px;
			padding: 7px 13px;
			border-radius: 999px;
			color: #087f8c;
			background: #d9fbff;
			font-size: 0.78rem;
			font-weight: bold;
			letter-spacing: 0.08em;
			text-transform: uppercase;
		}

		h1 { margin: 0; color: var(--navy); font-size: 2.15rem; }
		.intro { margin: 10px 0 28px; color: #627d98; line-height: 1.5; }

		.field { margin-bottom: 16px; }
		label { display: block; margin-bottom: 7px; font-size: 0.9rem; font-weight: bold; }
		input {
			width: 100%;
			padding: 13px 14px;
			border: 1px solid #bcccdc;
			border-radius: 9px;
			color: var(--text);
			background: var(--light);
			font: inherit;
			outline: none;
			transition: border-color 0.2s, box-shadow 0.2s;
		}
		input:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(40, 199, 217, 0.18); }

		button {
			width: 100%;
			margin-top: 8px;
			padding: 14px;
			border: 0;
			border-radius: 9px;
			color: white;
			background: linear-gradient(100deg, var(--blue), #0b9eb0);
			font: inherit;
			font-weight: bold;
			cursor: pointer;
			transition: transform 0.2s, box-shadow 0.2s;
		}
		button:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(23, 105, 170, 0.28); }

		.confirm {
			display: block;
			color: #22C55E;
		}

		.confirm-wrong {
			display: block;
			color: #EF4444;
		}
	</style>
</head>
<body>
	<main class="card">
		<span class="badge">Science Exhibition</span>
		<h1>ScienceSpark 2026</h1>
		<p class="intro">Join curious minds, explore bold ideas, and showcase your passion for science.</p>
		<form id="register">
			<div class="field">
				<label for="name">Full Name</label>
				<input id="name" name="name" type="text" placeholder="Enter your name" required />
			</div>
			<div class="field">
				<label for="class">Class</label>
				<input id="class" name="class" type="text" placeholder="e.g. Class 10" required />
			</div>
			<div class="field">
				<label for="school">School</label>
				<input id="school" name="school" type="text" placeholder="Enter your school" required />
			</div>
			<div class="field">
				<label for="email">Email Address</label>
				<input id="email" name="email" type="email" placeholder="you@example.com" required />
			</div>
			<button type="submit">Register for ScienceSpark</button>
		</form>
	</main>
</body>
</html>
